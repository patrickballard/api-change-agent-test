name: api-change-agent
on:
  workflow_dispatch:   # manual runs only

permissions:
  contents: write        # push the bot branch (never main)
  pull-requests: write   # open / update the PR

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # keep persist-credentials (default) so the push works
      - uses: patrickballard/api-change-agent@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # test-command: python -m pytest -q tests/unit
          # install-command: pip install -r requirements-dev.txt
